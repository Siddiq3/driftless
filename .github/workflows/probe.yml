name: probe
on: { push: { branches: [ci-probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: node -v && npm view zod version && npm view expo@57 version | tail -1 && npm view aws-cdk-lib version && npm view vitest version && npm view typescript version && npm view turbo version && npm view zod@4 version | tail -1
      - run: echo hello > probe.txt
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe.txt }
