name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_JOB: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: install
        run: |
          if [ -f pnpm-lock.yaml ]; then ci/step.sh install pnpm install --frozen-lockfile
          else ci/step.sh install pnpm install --no-frozen-lockfile; fi
          cp pnpm-lock.yaml ci-logs/mobile/ 2>/dev/null || true
      - name: format
        if: ${{ !cancelled() }}
        run: ci/step.sh format pnpm format:check
      - name: expo dependency check
        if: ${{ !cancelled() }}
        run: ci/step.sh expo-check npx expo install --check
      - name: expo doctor
        if: ${{ !cancelled() }}
        run: ci/step.sh expo-doctor npx expo-doctor
      - name: typecheck
        if: ${{ !cancelled() }}
        run: ci/step.sh typecheck pnpm typecheck
      - name: lint
        if: ${{ !cancelled() }}
        run: ci/step.sh lint pnpm lint
      - name: unit tests
        if: ${{ !cancelled() }}
        run: ci/step.sh test pnpm test
      - name: accuracy scorer tests
        if: ${{ !cancelled() }}
        run: ci/step.sh scorer-test python3 -m unittest discover -s scripts/accuracy -v
      - name: prebuild android
        if: ${{ !cancelled() }}
        run: ci/step.sh prebuild npx expo prebuild --platform android --no-install
      - name: gradle debug build
        if: ${{ !cancelled() }}
        working-directory: android
        run: ../ci/step.sh gradle ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: gradle projects
        if: ${{ !cancelled() }}
        working-directory: android
        run: ./gradlew projects --no-daemon -q > ../ci-logs/mobile/gradle-projects.txt 2>&1 || true
      - name: kotlin unit tests (tracking engine)
        if: ${{ !cancelled() }}
        working-directory: android
        run: ../ci/step.sh kotlin-test ./gradlew :tracking-android:testDebugUnitTest --no-daemon
      - name: collect kotlin test reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ci-logs/mobile/kotlin-tests
          cp modules/tracking-android/android/build/test-results/testDebugUnitTest/*.xml ci-logs/mobile/kotlin-tests/ 2>/dev/null \
            || find . -path '*tracking-android*' -name 'TEST-*.xml' -exec cp {} ci-logs/mobile/kotlin-tests/ \; 2>/dev/null || true
      - name: record APK
        if: ${{ !cancelled() }}
        run: ls -la android/app/build/outputs/apk/debug/ > ci-logs/mobile/apk.txt 2>&1 || true
      - name: upload debug APK (for device accuracy testing)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: driftless-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: logs-mobile, path: ci-logs/mobile, include-hidden-files: true }
      - name: fail if any step failed
        if: ${{ !cancelled() }}
        run: '! grep -v "exit=0" ci-logs/mobile/status.txt'

  # The Claude session developing this repo cannot read Actions logs directly, so pushes to main
  # publish step logs to the `ci-results` branch. Never runs for pull requests.
  publish-results:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: 'logs-*' } # never the APK
      - name: push to ci-results branch
        run: |
          mkdir -p out && cd out
          printf 'sha=%s\nrun=%s\nmobile=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ needs.mobile.result }}" > SUMMARY.txt
          git init -q -b ci-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-results
