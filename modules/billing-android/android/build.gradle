plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.driftless.billing'
version = '0.1.0'

android {
  namespace "app.driftless.billing"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Google Play Billing Library. Play requires a recent major version for new apps and updates.
  implementation 'com.android.billingclient:billing-ktx:8.0.0'
}
